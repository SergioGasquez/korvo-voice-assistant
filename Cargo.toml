[package]
name    = "korvo-voice-assistant"
version = "0.0.0"
edition = "2024"
authors = ["Sergio Gasquez <sergio.gasquez@gmail.com>"]
publish = false

[dependencies]
allocator-api2 = { version = "0.3.0", default-features = false, features = ["alloc"] }
# `embedded-tls` 0.18 does not build with the stable `der` 0.8 releases.
der = "=0.8.0-rc.10"
der_derive = "=0.8.0-rc.6"
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "dns",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-graphics = "0.8.1"
embedded-io-async = "0.7.0"
# `rsa` verifies certificates signed with RSA keys, such as both root certificates.
embedded-tls = { version = "0.18.0", default-features = false, features = ["rsa"] }
embedded-text = "0.7.2"
es8389 = { git = "https://github.com/SergioGasquez/es8389" }
log = "0.4.27"
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = "0.6.4"
reqwless = { version = "0.14.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
static_cell = "2.1.0"

# The esp-hal crates are pinned to a commit that fixes stale pixels at the start of DPI frames.
[dependencies.esp-alloc]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["esp32s31"]

[dependencies.esp-backtrace]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["esp32s31", "panic-handler", "println"]

[dependencies.esp-bootloader-esp-idf]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["esp32s31"]

[dependencies.esp-hal]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["esp32s31", "log-04", "unstable"]

[dependencies.esp-metadata-generated]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["esp32s31"]

[dependencies.esp-println]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["log-04"]

[dependencies.esp-radio]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["esp32s31", "log-04", "unstable", "wifi"]

[dependencies.esp-rtos]
git = "https://github.com/SergioGasquez/esp-hal"
rev = "c5052fded307ce323d99384074ef108860f4389b"
features = ["esp32s31", "esp-radio", "embassy", "log-04"]

[profile.release]
debug            = true
debug-assertions = true
lto              = "fat"
codegen-units    = 1
